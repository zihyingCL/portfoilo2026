<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI/UX 設計作品集 | 現代簡約風格</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">

    <script src="js/components.js"></script>

</head>

<body>
    <div id="page-transition-overlay"></div>
    <div id="navbar-placeholder"></div>

    <!-- 內頁 Hero -->
    <section class="inner-hero">
        <div class="container">
            <h1 class="inner-title">Graphic Design</h1>
            <p class="inner-desc">品牌視覺與社群行銷素材，透過設計傳遞核心價值與視覺張力。</p>
        </div>
    </section>

    <!-- 作品展示區塊 -->
    <section id="works" class="container border-0">
        <div id="graphic-works-grid" class="portfolio-grid-full"></div>
        <div class="d-flex justify-content-center">
            <a href="javascript:void(0);" onclick="history.back()" class="btn-outline"> <i
                    class="fas fa-arrow-left"></i> 回上一頁</a>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 載入 category 為 graphic 的作品
            loadWorks({ targetId: 'graphic-works-grid', category: 'graphic' });
        });
    </script>

    <script src="js/main.js"></script>

</body>

</html>
