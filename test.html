<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動態 Blob Hero | 簡約現代風格</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">

    <script src="js/components.js"></script>
    
    <!-- 引入原有字型 (與原網站一致) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 基礎重置 (與原網站風格對齊) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            background-color: #fafafa;
            color: #1e1e1e;
            line-height: 1.5;
            overflow-x: hidden;
        }
        /* 保留原 hero 基礎結構 */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #f9f9f9; /* 柔和底色 */
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 50%, rgba(255,255,255,0.4) 0%, transparent 60%);
            pointer-events: none;
            z-index: 2;
        }
        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin-left: 10%;
            color: #222;
        }
        .hero-subtitle {
            font-size: 1.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 1s 0.3s forwards;
        }
        .hero-desc {
            font-size: 1.3rem;
            font-weight: 300;
            max-width: 600px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeUp 1s 0.7s forwards;
        }
        .hero-stats {
            display: flex;
            gap: 60px;
            opacity: 0;
            animation: fadeUp 1s 0.9s forwards;
            flex-wrap: wrap;
        }
        .stat-item {
            font-weight: 300;
            transition: transform 0.2s ease;
        }
        .stat-item:hover {
            transform: translateY(-4px);
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 350;
            display: block;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #444;
        }
        .count-number {
            display: inline-block;
            min-width: 2rem;
            font-variant-numeric: tabular-nums;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 響應式 */
        @media (max-width: 768px) {
            .hero-content { margin-left: 5%; margin-right: 5%; }
            .hero-stats { gap: 30px; }
            .hero-desc { font-size: 1.1rem; }
            .stat-number { font-size: 1.6rem; }
        }

        /* ===== 動態 Blob 背景 (方案三增強版) ===== */
        .blob-bg {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(220, 220, 235, 0.6), rgba(200, 200, 215, 0.3));
            filter: blur(70px);
            z-index: 0;
            pointer-events: none;
            will-change: transform, border-radius;
            animation: morphBlob1 18s infinite alternate ease-in-out;
        }

        .blob-bg-2 {
            position: absolute;
            bottom: -15%;
            left: -8%;
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(235, 225, 215, 0.65), rgba(210, 200, 190, 0.3));
            filter: blur(75px);
            z-index: 0;
            pointer-events: none;
            will-change: transform, border-radius;
            animation: morphBlob2 22s infinite alternate ease-in-out;
        }

        /* 第一個 Blob 動態變形 – 複雜路徑變化 */
        @keyframes morphBlob1 {
            0% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
                transform: translate(0, 0) scale(1);
            }
            25% {
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
                transform: translate(-3%, 2%) scale(1.02);
            }
            50% {
                border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%;
                transform: translate(2%, -2%) scale(0.98);
            }
            75% {
                border-radius: 30% 70% 40% 60% / 50% 40% 60% 50%;
                transform: translate(-1%, 4%) scale(1.01);
            }
            100% {
                border-radius: 50% 50% 30% 70% / 60% 40% 70% 30%;
                transform: translate(0, -3%) scale(1);
            }
        }

        /* 第二個 Blob 動態變形 – 不同節奏 */
        @keyframes morphBlob2 {
            0% {
                border-radius: 40% 60% 30% 70% / 50% 40% 60% 50%;
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                border-radius: 60% 40% 70% 30% / 40% 60% 30% 70%;
                transform: translate(4%, -2%) rotate(2deg);
            }
            66% {
                border-radius: 30% 70% 50% 50% / 60% 30% 70% 40%;
                transform: translate(-2%, 3%) rotate(-3deg);
            }
            100% {
                border-radius: 70% 30% 60% 40% / 30% 70% 40% 60%;
                transform: translate(0, -1%) rotate(1deg);
            }
        }

        /* 增加一個極細微的浮動效果讓整體更有機 */
        .hero-content {
            animation: subtleFloat 12s infinite alternate ease-in-out;
        }
        @keyframes subtleFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(8px); }
        }
    </style>
</head>
<body>
    <!-- HERO 區塊：動態 Blob 背景 -->
    <section id="home" class="hero">
        <!-- 動態變形幾何色塊 -->
        <div class="blob-bg"></div>
        <div class="blob-bg-2"></div>
        
        <!-- 原有光暈 overlay (保留層次) -->
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
            <div class="hero-subtitle">個人作品展示</div>
            <p class="hero-desc">UI/UX 設計 ＆ 前端切版 ＆ 平面行銷設計</p>
            <div class="hero-stats">
                <div class="stat-item">
                    <span class="stat-number"><span class="count-number" data-target="6">0</span>年</span>
                    <span class="stat-label">相關工作經驗</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number"><span class="count-number" data-target="30">0</span>+</span>
                    <span class="stat-label">網頁/專案作品</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number"><span class="count-number" data-target="50">0</span>+</span>
                    <span class="stat-label">靜態設計</span>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 數字動畫 (與原本邏輯一致，滾動觸發)
        function animateNumber(element, target, duration = 1500) {
            let start = 0;
            const stepTime = 16;
            const steps = Math.ceil(duration / stepTime);
            const increment = target / steps;
            let current = 0;
            let stepCount = 0;
            const timer = setInterval(() => {
                stepCount++;
                current += increment;
                if (stepCount >= steps) {
                    element.innerText = target;
                    clearInterval(timer);
                } else {
                    element.innerText = Math.floor(current);
                }
            }, stepTime);
        }

        function startCountersInHero(heroElement) {
            const counters = heroElement.querySelectorAll('.count-number');
            counters.forEach(counter => {
                if (counter.getAttribute('data-animated') === 'true') return;
                const target = parseInt(counter.getAttribute('data-target'), 10);
                if (isNaN(target)) return;
                counter.innerText = "0";
                animateNumber(counter, target, 1500);
                counter.setAttribute('data-animated', 'true');
            });
        }

        // 使用 Intersection Observer 監測 Hero 是否進入視口 (確保數字動畫只觸發一次)
        const hero = document.querySelector('.hero');
        if (hero) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        startCountersInHero(hero);
                        observer.unobserve(hero); // 只觸發一次
                    }
                });
            }, { threshold: 0.3 });
            observer.observe(hero);
        }

        // 若頁面載入時已可見，立即觸發 (備用)
        if (hero && hero.getBoundingClientRect().top < window.innerHeight) {
            startCountersInHero(hero);
        }
    </script>
</body>
</html>
